# Cloudflare Worker: serves the site from /public and runs the enquiry API + admin.
name = "eagleseurope"
main = "server/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"

# Lead database. No database_id is needed: Wrangler creates the database
# automatically on the first deploy. The table is created by the Worker itself.
[[d1_databases]]
binding = "DB"
database_name = "eagleseurope-leads"
migrations_dir = "migrations"
